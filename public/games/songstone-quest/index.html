<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Songstone Quest</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Songstone Quest game"></canvas>
  <div id="touch" aria-hidden="true">
    <div id="dpad"><div id="knob"></div></div>
    <button data-key="menu" class="small" id="menuBtn">☰</button>
    <button data-key="item" class="item" id="bBtn">B</button>
    <button data-key="sword" class="sword" id="aBtn">A</button>
  </div>
  <button id="mute" title="Mute (M)" aria-label="Toggle sound">🔊</button>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
