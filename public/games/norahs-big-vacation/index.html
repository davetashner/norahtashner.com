<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b2a4a">
<title>Norah's Big Vacation</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- First-load splash (removed once the first scene is ready) -->
  <div id="loading">
    <div class="loader-ring" aria-hidden="true"></div>
    <div class="loader-text">Norah&apos;s Big Vacation</div>
    <div class="loader-sub">Packing the suitcase… 🧳</div>
  </div>

  <!-- Scene: the painted background (two layers for cross-fades) with the game
       canvas on top, in the same 400×700 coordinates. Zoomed together. -->
  <div id="scene">
    <div id="bg" class="bg"></div>
    <div id="bg2" class="bg"></div>
    <canvas id="play" aria-label="Game scene"></canvas>
  </div>

  <!-- Looping background music (src set per chapter by game.js) -->
  <audio id="music" loop preload="auto"></audio>

  <!-- Top bar: passport + progress + mute -->
  <div id="topbar">
    <button id="passportBtn" class="iconbtn" type="button" aria-label="Open passport" title="Passport">📖</button>
    <div id="progressPill" aria-live="polite"></div>
    <button id="muteBtn" class="iconbtn" type="button" aria-label="Toggle sound" title="Sound">🔊</button>
  </div>

  <!-- Short in-game hints under the top bar -->
  <div id="tip" aria-live="polite" hidden></div>

  <!-- Chapter story card -->
  <div id="narration" aria-live="polite" hidden></div>

  <!-- Answer buttons (counting swans, picking a macaron) -->
  <div id="choices" hidden></div>

  <!-- Action button (Let's go!) -->
  <button id="actionBtn" class="bigbtn" type="button" hidden></button>

  <!-- Passport overlay -->
  <div id="passport" class="overlay" role="dialog" aria-label="Passport" hidden>
    <div class="passport-book">
      <h2>Norah&apos;s Passport</h2>
      <p class="passport-sub">A stamp for every adventure. Tap one to play it again!</p>
      <p id="passportTotals" class="passport-totals"></p>
      <div id="stampGrid"></div>
      <button id="closePassport" class="bigbtn" type="button">Close</button>
      <button id="resetBtn" class="bigbtn ghost" type="button">Start Over</button>
    </div>
  </div>

  <!-- Chapter complete overlay -->
  <div id="celebrate" class="overlay" role="dialog" aria-label="Chapter complete" hidden>
    <div class="celebrate-card">
      <div class="confetti" aria-hidden="true"></div>
      <div id="celebrateStamp"></div>
      <h2 id="celebrateTitle">Chapter Complete!</h2>
      <div id="celebrateStars" class="big-stars" aria-label="Stars"></div>
      <p id="celebrateText"></p>
      <p id="celebrateCamile" class="cam-line"></p>
      <button id="celebrateNext" class="bigbtn" type="button"></button>
      <div class="celebrate-row">
        <button id="celebrateAgain" class="bigbtn ghost small" type="button">Play again</button>
        <button id="celebratePassport" class="bigbtn ghost small" type="button">Passport</button>
      </div>
    </div>
  </div>

</div>

<script src="assets.js"></script>
<script src="audio.js"></script>
<script src="games.js"></script>
<script src="game.js"></script>
<script>
  // Register the offline service worker (works on a plane after one load).
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* offline still fine without it */ });
    });
  }
</script>
</body>
</html>
